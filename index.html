<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DSA Journey — learn data structures and algorithms in JavaScript, pattern by pattern." />
    <meta name="theme-color" content="#5b4fe9" />
    <title>DSA Journey</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme + accent before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('dsa-journey:theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      try {
        var a = localStorage.getItem('dsa-journey:accent');
        document.documentElement.setAttribute('data-accent', /^(indigo|teal|rose|amber)$/.test(a) ? a : 'indigo');
      } catch (e) {
        document.documentElement.setAttribute('data-accent', 'indigo');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
