# Builds the app and publishes dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # run it by hand from the Actions tab (any branch)

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a deploy that's already publishing finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the site lives at https://<user>.github.io/<repo>/ — vite.config.js reads this as `base`
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # BrowserRouter routes: GitHub Pages answers unknown paths (deep links, refreshes) with 404.html,
      # so make that the app itself and let the router take over
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
